<script>
        // === 全局状态 ===
        let mode = 'single'; // 'single' | 'batch'
        let fileQueue = [];
        let processedBlobs = [];
        const stickers = ['✨', '🔥', '📺', '❤️', '🍿', '🎬', '🌟', '💿'];

        // === 初始化 ===
        window.onload = function() {
            document.getElementById('batchUpload').addEventListener('change', handleBatchSelect);
            document.getElementById('singleUpload').addEventListener('change', function(e) {
                if(e.target.files[0]) displayImage(e.target.files[0]);
            });
        };

        // === 核心逻辑：加载单张图片 (Promise化) ===
        function displayImage(file, isBatch = false) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const imgSrc = e.target.result;
                    const imgEl = document.getElementById('img');
                    
                    // 关键修复：确保图片元素加载完成
                    imgEl.onload = () => {
                        resolve(); 
                    };
                    imgEl.onerror = () => {
                        reject(new Error("图片加载失败"));
                    };

                    imgEl.src = imgSrc;
                    document.getElementById('bg').style.backgroundImage = `url(${imgSrc})`;
                    
                    // 立即更新文字
                    if(isBatch) {
                        autoFillInfo(file.name);
                    }
                    randomizeView();
                };
                
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // === 核心逻辑：随机化 (防限流) ===
        function randomizeView() {
            const bright = 0.7 + Math.random() * 0.3;
            document.getElementById('bg').style.filter = `blur(20px) brightness(${bright})`;
            
            const sticker = document.getElementById('sticker');
            sticker.innerText = stickers[Math.floor(Math.random() * stickers.length)];
            sticker.style.top = `${5 + Math.random() * 15}%`;
            sticker.style.right = `${5 + Math.random() * 15}%`;
            sticker.style.transform = `rotate(${Math.random() * 60 - 30}deg) scale(${0.8 + Math.random() * 0.4})`;

            document.getElementById('noise').style.opacity = 0.04 + Math.random() * 0.06;
            document.getElementById('content').style.padding = `${18 + Math.random() * 4}px`;
        }

        // === UI 交互逻辑 ===
        function switchTab(targetMode) {
            mode = targetMode;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === 'single') {
                document.getElementById('single-controls').classList.remove('hidden');
                document.getElementById('batch-controls').classList.add('hidden');
                document.getElementById('single-btns').classList.remove('hidden');
                document.getElementById('batch-btns').classList.add('hidden');
            } else {
                document.getElementById('single-controls').classList.add('hidden');
                document.getElementById('batch-controls').classList.remove('hidden');
                document.getElementById('single-btns').classList.add('hidden');
                document.getElementById('batch-btns').classList.remove('hidden');
            }
        }

        function updateText() {
            document.getElementById('title').innerText = document.getElementById('inputTitle').value;
            const tagsArr = document.getElementById('inputTags').value.split(' ');
            const tagHtml = tagsArr.map(t => t ? `<span class="tag">${t}</span>` : '').join('');
            document.getElementById('tags').innerHTML = tagHtml;
        }

        function updateStyle() {
            const style = document.getElementById('styleSelect').value;
            const card = document.getElementById('render-card');
            card.className = ''; 
            card.classList.add(`style-${style}`);
        }

        // === 批量处理逻辑 (优化版) ===
        function handleBatchSelect(e) {
            const files = Array.from(e.target.files);
            // 重置队列
            fileQueue = files.map((f, i) => ({ id: i, file: f, status: 'waiting' }));
            processedBlobs = [];
            renderFileList();
            document.getElementById('queueCount').innerText = files.length;
            if(files.length > 0) document.getElementById('startBatchBtn').disabled = false;
        }

        function renderFileList() {
            const list = document.getElementById('fileList');
            // 仅在列表为空或全部重置时重新生成，避免滚动条跳动
            if (list.children.length !== fileQueue.length) {
                list.innerHTML = '';
                fileQueue.forEach(item => {
                    const div = document.createElement('div');
                    div.className = `file-item`;
                    div.id = `file-${item.id}`;
                    div.innerHTML = `<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px">${item.file.name}</span><span class="status-icon">${getStatusIcon(item.status)}</span>`;
                    list.appendChild(div);
                });
            } else {
                // 仅更新状态图标和类名
                fileQueue.forEach(item => {
                    const el = document.getElementById(`file-${item.id}`);
                    if (el) {
                        el.className = `file-item ${item.status === 'processing' ? 'active' : ''} ${item.status === 'done' ? 'done' : ''}`;
                        el.querySelector('.status-icon').innerText = getStatusIcon(item.status);
                    }
                });
            }
        }

        function getStatusIcon(status) {
            if (status === 'waiting') return '⏳';
            if (status === 'processing') return '⚙️';
            if (status === 'done') return '✅';
            if (status === 'error') return '❌';
        }

        function autoFillInfo(filename) {
            if (!document.getElementById('autoFill').checked) return;
            // 移除扩展名和特殊字符
            let cleanName = filename.replace(/\.[^/.]+$/, "").replace(/[_-]/g, " ");
            document.getElementById('title').innerText = cleanName;
            
            const globalTags = document.getElementById('batchGlobalTags').value.split(' ');
            const tagHtml = globalTags.map(t => t ? `<span class="tag">${t}</span>` : '').join('');
            document.getElementById('tags').innerHTML = tagHtml;
        }

        // 辅助函数：强制等待，让浏览器渲染 UI
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        async function startBatch() {
            const btn = document.getElementById('startBatchBtn');
            btn.disabled = true;
            btn.innerText = "处理中 (请勿关闭)...";
            
            for (let i = 0; i < fileQueue.length; i++) {
                const item = fileQueue[i];
                if(item.status === 'done') continue; // 跳过已完成的

                // 1. 更新 UI 状态
                item.status = 'processing';
                renderFileList();
                // 滚动到当前项
                document.getElementById(`file-${item.id}`).scrollIntoView({ behavior: 'smooth', block: 'center' });

                try {
                    // 2. 加载图片并等待渲染完成
                    // 这里我们给它设置一个超时，防止某张图坏了卡死整个流程
                    await Promise.race([
                        displayImage(item.file, true),
                        new Promise((_, reject) => setTimeout(() => reject(new Error("加载超时")), 5000))
                    ]);

                    // 3. 强制暂停 300ms，确保 DOM 布局刷新 (解决文字不更新问题)
                    await sleep(300);

                    // 4. 截图
                    const canvas = await html2canvas(document.getElementById('render-card'), {
                        scale: 2, 
                        useCORS: true,
                        backgroundColor: null,
                        logging: false // 关闭日志提升性能
                    });

                    // 5. 转 Blob
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 0.9));
                    processedBlobs.push({ name: `REDNOTE_${item.file.name}.png`, blob: blob });

                    item.status = 'done';
                } catch (err) {
                    console.error(`File ${item.file.name} failed:`, err);
                    item.status = 'error';
                }
                
                // 更新列表
                renderFileList();
            }

            btn.innerText = "🎉 处理完成";
            btn.disabled = false;
            document.getElementById('dlBatchBtn').disabled = false;
        }

        // === 下载逻辑 ===
        function downloadSingle() {
            html2canvas(document.getElementById('render-card'), { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `cover_${Date.now()}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        function downloadBatch() {
            if(processedBlobs.length === 0) {
                alert("没有成功处理的图片");
                return;
            }
            const btn = document.getElementById('dlBatchBtn');
            btn.innerText = "正在打包...";
            
            const zip = new JSZip();
            const folder = zip.folder("小红书防限流图集");
            processedBlobs.forEach(img => {
                folder.file(img.name, img.blob);
            });
            zip.generateAsync({type:"blob"}).then(content => {
                saveAs(content, "批量洗图结果.zip");
                btn.innerText = "📦 打包下载 (ZIP)";
            });
        }
    </script>
