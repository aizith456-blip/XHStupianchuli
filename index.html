<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书洗图工厂 (V4 - 自由构图版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --primary: #ff2442;
            --bg: #121212;
            --panel: #1e1e1e;
            --text: #e0e0e0;
            --border: #333;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
            user-select: none;
        }

        /* --- 左侧侧边栏 --- */
        .sidebar {
            width: 340px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 20; /* 提高层级 */
        }

        .header { padding: 15px 20px; background: #252525; border-bottom: 1px solid var(--border); }
        .header h1 { margin: 0; font-size: 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; }

        .scroll-content { flex: 1; overflow-y: auto; padding: 20px; }

        .control-group { margin-bottom: 15px; }
        .control-label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
        
        input[type="text"], select {
            width: 100%; background: #2c2c2c; border: 1px solid #444; color: white; padding: 8px; 
            border-radius: 6px; box-sizing: border-box; font-size: 13px; outline: none;
        }
        input[type="text"]:focus { border-color: var(--primary); }

        /* 图片列表 */
        .queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .btn-mini { font-size: 10px; background: #333; border: none; color: #aaa; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
        .btn-mini:hover { background: #444; color: #fff; }

        .file-list {
            border: 1px solid #444; border-radius: 6px; height: 180px; overflow-y: auto; background: #1a1a1a;
        }
        .file-item {
            padding: 8px 10px; border-bottom: 1px solid #333; font-size: 12px; display: flex; 
            justify-content: space-between; align-items: center; background: #222; cursor: pointer;
        }
        .file-item:hover { background: #2a2a2a; }
        .file-item.active { border-left: 3px solid var(--primary); background: #2f2f2f; }
        .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; }
        .btn-del { cursor: pointer; color: #666; font-weight: bold; padding: 2px 6px; }
        .btn-del:hover { color: #ff4d4f; background: rgba(255, 77, 79, 0.1); border-radius: 4px; }

        /* 按钮 */
        .btn-area { padding: 20px; border-top: 1px solid var(--border); background: var(--panel); }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; 
            font-weight: bold; font-size: 14px; transition: 0.2s; margin-bottom: 8px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #e0203a; }
        .btn-primary:disabled { background: #555; cursor: not-allowed; }
        .btn-secondary { background: #333; color: #ccc; }
        .btn-secondary:hover { background: #444; }

        /* --- 右侧画布区域 --- */
        .preview-area {
            flex: 1; background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
            background-image: radial-gradient(#333 1px, transparent 1px); background-size: 20px 20px;
            overflow: hidden;
        }

        #render-card {
            width: 375px; height: 500px; background: #fff; position: relative; overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.6); transition: all 0.3s ease;
            flex-shrink: 0; /* 防止被挤压 */
        }

        /* 背景模糊层 */
        .bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(20px) brightness(0.8); z-index: 0; transform: scale(1.1);
        }
        /* 噪点层 */
        .noise-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
        
        .content-layer {
            position: relative; z-index: 2; width: 100%; height: 100%;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            pointer-events: none; /* 让事件穿透到下层，但子元素需开启 */
        }

        /* === 核心：图片容器 === */
        .poster-wrapper {
            position: absolute; top: 20px; left: 20px; right: 20px; bottom: 120px;
            background: #000; border-radius: 8px; overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); 
            /* 关键样式：允许交互 */
            pointer-events: auto; 
            cursor: grab;
        }
        .poster-wrapper:active { cursor: grabbing; }

        .poster-img { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            pointer-events: none; /* 禁止图片本身响应，由wrapper代理 */
            transform-origin: center center;
            will-change: transform;
        }
        
        /* 贴纸 */
        .sticker { position: absolute; font-size: 32px; z-index: 5; cursor: grab; user-select: none; pointer-events: auto; }

        /* 复位按钮 */
        .reset-btn {
            position: absolute; top: 5px; right: 5px; width: 24px; height: 24px;
            background: rgba(0,0,0,0.5); color: #fff; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 20; font-size: 14px; opacity: 0; transition: 0.2s;
            pointer-events: auto;
        }
        .poster-wrapper:hover .reset-btn { opacity: 1; }
        .reset-btn:hover { background: var(--primary); }

        /* 可拖拽文字 */
        .draggable-text {
            position: absolute; z-index: 20; cursor: move; pointer-events: auto;
            border: 1px dashed transparent; transition: border 0.2s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            width: 80%; text-align: center;
        }
        .draggable-text:hover { border: 1px dashed rgba(255,255,255,0.5); background: rgba(0,0,0,0.2); border-radius: 4px; }
        
        #drag-title { bottom: 60px; left: 10%; font-size: 22px; font-weight: 800; line-height: 1.3; color: #fff; }
        #drag-tags { bottom: 30px; left: 10%; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
        .tag { font-size: 10px; padding: 4px 8px; background: rgba(255,255,255,0.2); border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); font-weight: 600; color: #fff; }

        /* 风格变体 */
        .style-minimal .bg-layer { display: none; }
        .style-minimal .content-layer { background: #fff; backdrop-filter: none; }
        .style-minimal #drag-title { color: #333; text-shadow: none; }
        .style-minimal .tag { background: #f0f0f0; border: none; color: #555; }

        .tip { position: absolute; bottom: 10px; color: #666; font-size: 12px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="header">
            <h1>🔥 洗图工厂 <span style="font-size:10px;background:#333;padding:2px 5px;border-radius:4px;">Pro V4</span></h1>
        </div>

        <div class="scroll-content">
            <!-- 1. 图片管理 -->
            <div class="control-group">
                <div class="queue-header">
                    <label class="control-label">🖼️ 图片列表 (<span id="count">0</span>)</label>
                    <button class="btn-mini" onclick="clearAll()">清空</button>
                </div>
                <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
                
                <div class="file-list" id="fileList">
                    <div style="padding:20px; text-align:center; color:#555; font-size:12px;">
                        暂无图片<br>请点击下方按钮添加
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()" style="margin-top:10px;">
                    ➕ 添加图片 (支持多选)
                </button>
            </div>

            <hr style="border:0; border-top:1px solid #333; margin: 15px 0;">

            <!-- 2. 排版设置 -->
            <div class="control-group">
                <label class="control-label">🎨 风格</label>
                <select id="styleSelect" onchange="updateStyle()">
                    <option value="glass">磨砂玻璃 (推荐)</option>
                    <option value="minimal">极简白底</option>
                    <option value="dark">暗夜模式</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">📝 标题 (可在右侧拖拽)</label>
                <input type="text" id="inputTitle" value="点击此处修改标题" oninput="updateText()">
            </div>

            <div class="control-group">
                <label class="control-label">🏷️ 标签 (空格分隔)</label>
                <input type="text" id="inputTags" value="高清 无水印 推荐" oninput="updateText()">
            </div>

            <div class="control-group">
                <button class="btn btn-secondary" onclick="randomizeView()">🎲 随机微调参数 (防查重)</button>
            </div>
        </div>

        <div class="btn-area">
            <button class="btn btn-primary" id="startBtn" onclick="startProcessing()" disabled>🚀 开始批量处理并下载</button>
            <div id="statusText" style="text-align:center; font-size:12px; color:#888; margin-top:5px;"></div>
        </div>
    </div>

    <div class="preview-area">
        <div id="render-card">
            <div class="noise-layer" id="noise"></div>
            <div class="bg-layer" id="bg"></div>
            
            <div class="content-layer">
                <!-- 图片容器 (支持滚轮缩放、拖拽移动) -->
                <div class="poster-wrapper" id="imgWrapper">
                    <img src="https://via.placeholder.com/300x400?text=Preview" class="poster-img" id="img">
                    <div class="reset-btn" onclick="resetImgTransform(event)" title="重置图片位置">↺</div>
                    <div class="sticker" id="sticker" style="top:10%; right:10%;">✨</div>
                </div>

                <!-- 可拖拽标题 -->
                <div class="draggable-text" id="drag-title" onmousedown="startDragText(event, this)">
                    点击修改标题
                </div>

                <!-- 可拖拽标签 -->
                <div class="draggable-text" id="drag-tags" onmousedown="startDragText(event, this)">
                    <span class="tag">标签1</span>
                </div>
            </div>
        </div>
        <div class="tip">💡 操作提示：海报区域可<b>滚轮缩放</b>、<b>按住拖拽</b>调整构图</div>
    </div>

    <script>
        // === 数据状态 ===
        let fileQueue = []; 
        let currentPreviewIndex = -1;
        const stickers = ['✨', '🔥', '📺', '❤️', '🍿', '🎬', '🌟', '💿'];
        
        // 图片变换状态 (全局共享，作为模板)
        let imgState = { scale: 1, x: 0, y: 0 };

        // === 初始化 ===
        window.onload = function() {
            const fileInput = document.getElementById('fileInput');
            fileInput.addEventListener('change', handleFiles);
            updateText(); 
            initImgInteractions(); // 初始化图片交互
        };

        // === 1. 文件列表管理 ===
        function handleFiles(e) {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;

            files.forEach(f => {
                fileQueue.push({ id: Date.now() + Math.random(), file: f, status: 'waiting' });
            });

            if(currentPreviewIndex === -1 && fileQueue.length > 0) previewFile(0);
            renderList();
            e.target.value = '';
        }

        function renderList() {
            const list = document.getElementById('fileList');
            document.getElementById('count').innerText = fileQueue.length;
            document.getElementById('startBtn').disabled = fileQueue.length === 0;

            if(fileQueue.length === 0) {
                list.innerHTML = `<div style="padding:20px; text-align:center; color:#555; font-size:12px;">暂无图片<br>请点击下方按钮添加</div>`;
                document.getElementById('img').src = 'https://via.placeholder.com/300x400?text=No+Image';
                return;
            }

            list.innerHTML = '';
            fileQueue.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `file-item ${index === currentPreviewIndex ? 'active' : ''}`;
                let icon = item.status === 'done' ? '✅' : (item.status === 'error' ? '❌' : '');
                
                div.innerHTML = `
                    <div class="file-name" onclick="previewFile(${index})">${index+1}. ${item.file.name}</div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span>${icon}</span>
                        <span class="btn-del" onclick="removeFile(${index})">✕</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function removeFile(index) {
            fileQueue.splice(index, 1);
            if(fileQueue.length === 0) currentPreviewIndex = -1;
            else if (index <= currentPreviewIndex) currentPreviewIndex = Math.max(0, currentPreviewIndex - 1);
            renderList();
            if(currentPreviewIndex !== -1) previewFile(currentPreviewIndex);
        }

        function clearAll() {
            if(confirm('确定清空所有图片吗？')) {
                fileQueue = [];
                currentPreviewIndex = -1;
                renderList();
            }
        }

        function previewFile(index) {
            if(index < 0 || index >= fileQueue.length) return;
            currentPreviewIndex = index;
            
            const item = fileQueue[index];
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById('img');
                img.src = e.target.result;
                document.getElementById('bg').style.backgroundImage = `url(${e.target.result})`;
                // 保持当前的缩放和位置状态，不重置，方便套用模板
            };
            reader.readAsDataURL(item.file);
            renderList();
        }

        // === 2. 图片交互逻辑 (Zoom & Pan) ===
        function initImgInteractions() {
            const wrapper = document.getElementById('imgWrapper');
            const img = document.getElementById('img');

            // 滚轮缩放
            wrapper.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.05 : 0.05;
                imgState.scale = Math.max(0.1, Math.min(5, imgState.scale + delta)); // 限制缩放 0.1 - 5倍
                applyImgTransform();
            });

            // 拖拽移动
            let isDragging = false;
            let startX, startY;

            wrapper.addEventListener('mousedown', (e) => {
                if(e.target.classList.contains('sticker') || e.target.classList.contains('reset-btn')) return; // 避开贴纸和按钮
                isDragging = true;
                startX = e.clientX - imgState.x;
                startY = e.clientY - imgState.y;
                wrapper.style.cursor = 'grabbing';
            });

            window.addEventListener('mousemove', (e) => {
                if(!isDragging) return;
                e.preventDefault();
                imgState.x = e.clientX - startX;
                imgState.y = e.clientY - startY;
                applyImgTransform();
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                wrapper.style.cursor = 'grab';
            });
        }

        function applyImgTransform() {
            const img = document.getElementById('img');
            img.style.transform = `translate(${imgState.x}px, ${imgState.y}px) scale(${imgState.scale})`;
        }

        function resetImgTransform(e) {
            e.stopPropagation(); // 防止触发拖拽
            imgState = { scale: 1, x: 0, y: 0 };
            applyImgTransform();
        }

        // === 3. 文字/贴纸拖拽逻辑 ===
        let dragItem = null;
        let diffX = 0, diffY = 0;

        function startDragText(e, el) {
            e.preventDefault();
            dragItem = el;
            const rect = el.getBoundingClientRect();
            diffX = e.clientX - rect.left;
            diffY = e.clientY - rect.top;
            document.addEventListener('mousemove', onDragText);
            document.addEventListener('mouseup', stopDragText);
        }

        function onDragText(e) {
            if (!dragItem) return;
            const container = document.getElementById('render-card').getBoundingClientRect();
            let newLeft = e.clientX - container.left - diffX;
            let newTop = e.clientY - container.top - diffY;
            
            dragItem.style.left = newLeft + 'px';
            dragItem.style.top = newTop + 'px';
            dragItem.style.bottom = 'auto';
            dragItem.style.right = 'auto';
        }

        function stopDragText() {
            dragItem = null;
            document.removeEventListener('mousemove', onDragText);
            document.removeEventListener('mouseup', stopDragText);
        }

        // === 4. 辅助功能 ===
        function updateText() {
            document.getElementById('drag-title').innerText = document.getElementById('inputTitle').value;
            const tags = document.getElementById('inputTags').value.split(' ').filter(t=>t);
            document.getElementById('drag-tags').innerHTML = tags.map(t => `<span class="tag">${t}</span>`).join('');
        }

        function updateStyle() {
            const style = document.getElementById('styleSelect').value;
            const card = document.getElementById('render-card');
            card.className = ''; 
            card.classList.add(`style-${style}`);
        }

        function randomizeView() {
            const bright = 0.6 + Math.random() * 0.4;
            document.getElementById('bg').style.filter = `blur(20px) brightness(${bright})`;
            
            const sticker = document.getElementById('sticker');
            sticker.innerText = stickers[Math.floor(Math.random() * stickers.length)];
            sticker.style.transform = `rotate(${Math.random() * 60 - 30}deg) scale(${0.8 + Math.random() * 0.4})`;
            
            document.getElementById('noise').style.opacity = 0.04 + Math.random() * 0.05;
        }

        // === 5. 批量处理 ===
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        async function startProcessing() {
            const btn = document.getElementById('startBtn');
            const status = document.getElementById('statusText');
            btn.disabled = true;
            btn.innerText = "处理中...";
            const processedBlobs = [];
            
            for (let i = 0; i < fileQueue.length; i++) {
                previewFile(i); 
                status.innerText = `正在处理第 ${i+1} / ${fileQueue.length} 张: ${fileQueue[i].file.name}`;
                
                try {
                    await sleep(500); // 等待渲染
                    const canvas = await html2canvas(document.getElementById('render-card'), {
                        scale: 2, useCORS: true, backgroundColor: null
                    });
                    const blob = await new Promise(r => canvas.toBlob(r, 'image/png', 0.9));
                    processedBlobs.push({ name: `washed_${fileQueue[i].file.name.replace(/\.[^/.]+$/, "")}.png`, blob: blob });
                    fileQueue[i].status = 'done';
                } catch (err) {
                    console.error(err);
                    fileQueue[i].status = 'error';
                }
            }

            renderList();
            status.innerText = "正在打包下载...";
            if(processedBlobs.length > 0) {
                const zip = new JSZip();
                processedBlobs.forEach(img => zip.file(img.name, img.blob));
                const content = await zip.generateAsync({type:"blob"});
                saveAs(content, "洗图结果.zip");
            }

            btn.disabled = false;
            btn.innerText = "🚀 开始批量处理并下载";
            status.innerText = "完成";
        }
    </script>
</body>
</html>
